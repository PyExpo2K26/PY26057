services:
  - type: web
    name: farmio
    runtime: python
    rootDir: CODE
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/database.db
    disks:
      - name: farmio-data
        mountPath: /var/data
        sizeGB: 1
