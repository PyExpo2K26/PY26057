<form method="POST">
    <input type="text" name="phone" placeholder="Enter Mobile Number" required
           style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px;">
    
    <button type="submit" class="btn-primary">Send OTP</button>

    <hr style="margin: 20px 0; opacity: 0.2;">

    <input type="text" name="otp" placeholder="Enter 6-Digit OTP"
           style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; text-align: center;">
    
    <button type="submit" class="btn-primary" style="background: #1b4332;">Verify & Login</button>
</form>
