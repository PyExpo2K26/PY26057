{% extends "layout.html" %}
{% block content %}
<div class="glass-card">
    <h2 class="tagline">Step 2: Field Verification</h2>
    <p>Now, show us your live farm field.</p>
    <div id="field-box" style="background: #000; height: 200px; border-radius: 15px; margin-bottom: 20px;"></div>
    
    <button class="btn-primary" onclick="failAndUpload()">Verify Live Field</button>

    <div id="backup-upload" style="display:none; margin-top:20px;">
        <p style="color:red;">Live Field Not Detected.</p>
        <input type="file" name="demo_video" class="btn-primary" style="background:white; color:black;">
        <button onclick="window.location.href='/dashboard/farmer'" class="btn-primary">Submit Demo</button>
    </div>
</div>

<script>
    function failAndUpload() {
        document.getElementById('backup-upload').style.display = 'block';
    }
</script>
{% endblock %}
