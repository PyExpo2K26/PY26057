{% extends "layout.html" %}
{% block content %}
<div class="glass-card">
    <h2 class="tagline">Step 1: Face Verification</h2>
    <div id="camera-box" style="border: 3px solid var(--leaf-green); border-radius: 50%; width: 200px; height: 200px; margin: 0 auto 20px; overflow: hidden;">
        <video id="video" autoplay style="width: 100%; height: 100%; object-fit: cover;"></video>
    </div>
    <button class="btn-primary" onclick="startFaceScan()">Scan Face</button>
</div>

<script>
    function startFaceScan() {
        // Simulate scanning
        setTimeout(() => { window.location.href = "/verify/field"; }, 2000);
    }
</script>
{% endblock %}
